[project]
name = "hoard-api"
version = "0.1.0"
description = "The Reading Hoard backend: share a link, get the books in the video."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "google-genai>=1.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "jiter>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
