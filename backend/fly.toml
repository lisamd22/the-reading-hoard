# fly launch --no-deploy, then: fly volumes create hoard_data --size 1 --region iad
# fly secrets set GEMINI_API_KEY=... APP_KEY=... SCRAPECREATORS_API_KEY=... YOUTUBE_API_KEY=...
app = "hoard-api"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/hoard.db"
  PIPELINE_VERSION = "v1"
  WORKERS = "4"
  TIKTOK_VENDOR_FIRST = "1"

[[mounts]]
  source = "hoard_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: a cold start on a 10 s job is a 40 s job.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
